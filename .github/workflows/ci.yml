name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Checagem estatica (pyflakes)
        run: python -m pyflakes main.py configuracoes.py build.py core database ia services ui tests

      - name: Testes do motor de leitura
        run: python -m unittest discover -s tests -v
