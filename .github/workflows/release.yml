name: Release

# Publicar uma versao:  git tag v2.1  &&  git push origin v2.1
# O GitHub compila o Lumina.exe e anexa a pagina de Releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  executavel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Testes antes de publicar
        run: python -m unittest discover -s tests

      - name: Compilar Lumina.exe
        run: python build.py

      - name: Publicar na pagina de Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Lumina.exe
          generate_release_notes: true
